<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día mi amor - Ana Gissel Velasquez</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    overflow-x:hidden;
    background: linear-gradient(180deg, #fff9e6 0%, #ffe9a8 50%, #ffd966 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    position:relative;
  }

  /* Flores amarillas flotando de fondo */
  .flower-bg {
    position:fixed;
    top:-10%;
    font-size:28px;
    animation: fall linear infinite;
    opacity:0.85;
    pointer-events:none;
    user-select:none;
    z-index:1;
    filter: grayscale(1) sepia(1) hue-rotate(-10deg) saturate(6) brightness(1.15);
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }

  .container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 20px;
  }

  .titulo {
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    color:#7a5c00;
    text-shadow: 1px 1px 0 #fff8dc;
    margin-bottom:10px;
    animation: aparecer 1.5s ease-out;
  }

  .subtitulo {
    font-size: clamp(1rem, 3vw, 1.4rem);
    color:#8a6d00;
    margin-bottom:35px;
    animation: aparecer 2s ease-out;
  }

  @keyframes aparecer {
    from { opacity:0; transform: translateY(-20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .instruccion {
    font-size:1rem;
    color:#6b5300;
    margin-bottom:25px;
    font-style:italic;
  }

  .big-heart {
    font-size:clamp(80px, 20vw, 140px);
    color:#ff5c8a;
    cursor:pointer;
    user-select:none;
    transition: transform 0.2s ease;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
  }
  .big-heart:hover { transform: scale(1.1); }
  .big-heart:active { transform: scale(0.9); }
  .big-heart.pulse { animation: latido 1.1s ease-in-out infinite; }
  @keyframes latido {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .mensaje-final {
    display:none;
    margin-top:30px;
    animation: aparecer 1.2s ease-out;
  }
  .mensaje-final.visible { display:block; }
  .mensaje-final h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    color:#d1006b;
    text-shadow: 1px 1px 0 #fff2e6;
    margin-bottom:8px;
  }
  .mensaje-final p {
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    color:#7a5c00;
    font-weight:bold;
  }

  /* Rosas amarillas que aparecen al hacer clic */
  .rose-pop {
    position:fixed;
    font-size:34px;
    pointer-events:none;
    z-index:10;
    animation: popRose 1.6s ease-out forwards;
    filter: grayscale(1) sepia(1) hue-rotate(-10deg) saturate(6) brightness(1.15);
  }
  @keyframes popRose {
    0%   { transform: translateY(0) scale(0) rotate(0deg); opacity:1; }
    60%  { transform: translateY(-60px) scale(1.2) rotate(20deg); opacity:1; }
    100% { transform: translateY(-140px) scale(0.8) rotate(-15deg); opacity:0; }
  }

  /* Corazones flotantes al hacer clic */
  .heart-pop {
    position:fixed;
    font-size:22px;
    color:#ff6f9f;
    pointer-events:none;
    z-index:10;
    animation: popHeart 1.4s ease-out forwards;
  }
  @keyframes popHeart {
    0%   { transform: translateY(0) scale(0.5); opacity:1; }
    100% { transform: translateY(-120px) scale(1.3); opacity:0; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="titulo">🌼 Para Ana Gissel Velasquez 🌼</div>
  <div class="subtitulo">Hoy es un día especial para celebrarte</div>
  <div class="instruccion">Dale clic al corazón 💛</div>

  <div class="big-heart pulse" id="heart">💛</div>

  <div class="mensaje-final" id="mensajeFinal">
    <h1>🌹 Ana Gissel Velasquez 🌹</h1>
    <p>Te amo, feliz día</p>
  </div>
</div>

<script>
  const emojisFondo = ['🌼','🌻','🌸'];
  const numFlores = 22;
  for (let i = 0; i < numFlores; i++) {
    const f = document.createElement('div');
    f.className = 'flower-bg';
    f.textContent = emojisFondo[Math.floor(Math.random()*emojisFondo.length)];
    f.style.left = Math.random()*100 + 'vw';
    f.style.fontSize = (18 + Math.random()*22) + 'px';
    f.style.animationDuration = (8 + Math.random()*10) + 's';
    f.style.animationDelay = (Math.random()*10) + 's';
    document.body.appendChild(f);
  }

  const heart = document.getElementById('heart');
  const mensajeFinal = document.getElementById('mensajeFinal');
  let clicks = 0;

  heart.addEventListener('click', function(e) {
    clicks++;

    // Rosas y tulipanes amarillos
    for (let i = 0; i < 8; i++) {
      const rose = document.createElement('div');
      rose.className = 'rose-pop';
      rose.textContent = Math.random() < 0.5 ? '🌹' : '🌷';
      rose.style.left = (e.clientX + (Math.random()*160 - 80)) + 'px';
      rose.style.top = (e.clientY + (Math.random()*40 - 20)) + 'px';
      document.body.appendChild(rose);
      setTimeout(() => rose.remove(), 1600);
    }

    // Corazones
    for (let i = 0; i < 8; i++) {
      const h = document.createElement('div');
      h.className = 'heart-pop';
      h.textContent = ['💛','💕','💖','💗'][Math.floor(Math.random()*4)];
      h.style.left = (e.clientX + (Math.random()*200 - 100)) + 'px';
      h.style.top = (e.clientY + (Math.random()*40 - 20)) + 'px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1400);
    }

    if (clicks >= 1) {
      mensajeFinal.classList.add('visible');
    }
  });
</script>

</body>
</html>
